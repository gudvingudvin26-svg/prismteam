[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers --tb=short -v
testpaths = app_modules

[coverage:run]
source = app_modules
omit = */migrations/*, */tests.py, */tests_ws.py, */test_*.py

[coverage:report]
show_missing = True
fail_under = 70