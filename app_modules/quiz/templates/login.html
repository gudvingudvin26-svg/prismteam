<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Вход</h1>
    <form method = "POST">
        {% csrf_token %}
        <div>
            <p>Введите свой username/email/номер телефона (без "+"):</p>
            <input type="text" name = "identification_parameter">
        </div>
        <div>
            <p>Введите пароль:</p>
            <input type="password" name = "password">
        </div>
        <div>
            <input type = "submit">
        </div>
    </form>
</body>
</html>
