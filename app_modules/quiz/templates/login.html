<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<h1>Вход</h1>
    <form method="POST">
        {% csrf_token %}
        <div>
            <p>Введите username или email:</p>
            <input type="text" name="identification_parameter" required>
        </div>
        <div>
            <p>Введите пароль:</p>
            <input type="password" name="password" required>
        </div>
        <div>
            <input type="submit" value="Войти">
        </div>
    </form>
</body>
</html>
