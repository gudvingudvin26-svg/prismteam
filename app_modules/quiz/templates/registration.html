<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Регистрация</h1>
    <form method = "POST">
        {% csrf_token %}
        <div>
            <p>Введите свой username:</p>
            <input type="text" name = "username">
        </div>
        <div>
            <p>Введите свой email:</p>
            <input type="text" name = "email">
        </div>
        <div>
            <p>Введите свой номер телефона (необязательно):</p>
            <label>+ </label>
            <input type="text" name = "phone">
        </div>
        <div>
            <p>Введите и повторите пароль:</p>
            <input type="password" name = "password">
            <input type="password" name = "again_password">
        </div>
        <div>
            <input type = "submit">
        </div>
    </form>
</body>
</html>
