image: python:3.11

stages:
  - lint
  - test
  - build
  - docs

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -m venv venv
  - source venv/bin/activate
  - pip install -r requirements-dev.txt

lint:
  stage: lint
  script:
    - pylint --load-plugins=pylint_django --django-settings-module=config.settings --ignore=migrations,tests.py app_modules
  allow_failure: false

test:auto:
  stage: test
  script:
    - pytest --cov=app_modules --cov-fail-under=70 --cov-report=term --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - htmlcov/
    expire_in: 1 week

test:manual:
  stage: test
  script:
    - pytest --cov=app_modules --cov-fail-under=70 --cov-report=term --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - htmlcov/
    expire_in: 1 week
  when: manual
  allow_failure: true

build:
  stage: build
  script:
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 month
  only:
    - main
    - develop

docs:
  stage: docs
  script:
    - cd docs
    - make html
  artifacts:
    paths:
      - docs/build/html/
    expire_in: 1 month
  only:
    - main
    - develop