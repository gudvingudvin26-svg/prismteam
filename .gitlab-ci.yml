image: python:3.11

# Этапы пайплайна
stages:
  - lint
  - test
  - build

# Переменные окружения (опционально)
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Кэширование зависимостей для ускорения
cache:
  paths:
    - .cache/pip
    - venv/

# Job для линтинга (PEP8)
lint:
  stage: lint
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install flake8
  script:
    - flake8 . --max-line-length=120   # можно настроить параметры
  only:
    - main                            # или branches: - main, но для push на любую ветку можно убрать

# Job для тестирования с проверкой покрытия
test:
  stage: test
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install pytest pytest-cov
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
  script:
    # Запуск pytest с измерением покрытия. Укажите нужную папку с кодом (например, my_package или .)
    - pytest --cov=my_package --cov-report=term --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - htmlcov/                  # сохраняем HTML-отчёт как артефакт
    expire_in: 1 week
  only:
    - main

# Job для сборки (пример: упаковка приложения)
build:
  stage: build
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install build
  script:
    - python -m build   # собирает .tar.gz и .whl в dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 month
  only:
    - main
