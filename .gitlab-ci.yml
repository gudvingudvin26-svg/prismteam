stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NODE_MODULES_CACHE: "$CI_PROJECT_DIR/frontend/node_modules"

cache:
  paths:
    - .cache/pip
    - frontend/node_modules

# ========== БЭКЕНД ТЕСТЫ ==========
backend-test:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
  script:
    - python manage.py migrate
    - python manage.py test app_modules.quiz
  only:
    - main
    - develop-backend
    - merge_requests

# ========== ФРОНТЕНД ТЕСТЫ ==========
frontend-test:
  stage: test
  image: node:18
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run test
  only:
    - main
    - develop-backend
    - merge_requests

# ========== ЛИНТЕРЫ ==========
pylint:
  stage: test
  image: python:3.11
  before_script:
    - pip install pylint pylint-django
  script:
    - pylint app_modules/quiz --fail-under=8.0
  allow_failure: true
  only:
    - merge_requests

eslint:
  stage: test
  image: node:18
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run lint
  allow_failure: true
  only:
    - merge_requests

# ========== СБОРКА ==========
build-backend:
  stage: build
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - python manage.py check
  only:
    - main
    - develop-backend

build-frontend:
  stage: build
  image: node:18
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
  only:
    - main
    - develop-backend

# ========== ДЕПЛОЙ (опционально) ==========
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Deploy step - configure your server here"
  only:
    - main
  when: manual