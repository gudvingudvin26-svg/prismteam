image: python:3.11

stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

lint:
  stage: lint
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install flake8
  script:
    - flake8 . --max-line-length=120
  only:
    - main

test:
  stage: test
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install pytest pytest-cov
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
  script:
    - pytest --cov=my_package --cov-report=term --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - htmlcov/
    expire_in: 1 week
  only:
    - main

build:
  stage: build
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install build
  script:
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 month
  only:
    - main
