stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NODE_MODULES_CACHE: "$CI_PROJECT_DIR/frontend/node_modules"
  DATABASE_URL: "sqlite:///db.sqlite3"
  DEBUG: "False"

cache:
  paths:
    - .cache/pip
    - frontend/node_modules

backend-test:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py makemigrations --check
  only:
    - main
    - develop
  allow_failure: true

frontend-build:
  stage: build
  image: node:18
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
  only:
    - main
    - develop

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Deploy step - configure your server here"
  only:
    - main
  when: manual