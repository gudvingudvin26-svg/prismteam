services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: prismteam
      POSTGRES_USER: prismteam_user
      POSTGRES_PASSWORD: prismteam_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - /app/venv
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings

volumes:
  postgres_data: