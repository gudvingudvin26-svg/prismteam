services:
  - type: web
    name: prismteam-backend
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p 10000 config.asgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prismteam-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: prismteam-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: prismteam-backend.onrender.com,localhost,127.0.0.1
      - key: RENDER
        value: true
      - key: RENDER_BACKEND_URL
        value: https://prismteam-backend.onrender.com
      - key: RENDER_FRONTEND_URL
        value: https://prismteam-frontend.onrender.com

  - type: web
    name: prismteam-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://prismteam-backend.onrender.com

  - type: redis
    name: prismteam-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: prismteam-db
    databaseName: prismteam
    plan: free